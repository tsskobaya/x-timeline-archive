<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>X Timeline Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#e7e9ea;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
        .header{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.82);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid #2f3336;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between}
        .header-left{display:flex;align-items:center;gap:10px}
        .header-left h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
        .x-icon{width:28px;height:28px;fill:#e7e9ea}
        .sub-header{padding:16px 20px 8px;display:flex;align-items:baseline;justify-content:space-between}
        .sub-header h2{font-size:15px;font-weight:600;color:#71767b}
        .sub-header .count{font-size:13px;color:#536471}
        .archive-list{padding:4px 16px}
        .archive-card{background:#16181c;border:1px solid #2f3336;border-radius:16px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;text-decoration:none;display:block;color:inherit;-webkit-user-select:none;user-select:none}
        .archive-card:hover{background:#1d1f23;border-color:#3a3d41}
        .archive-card:active{transform:scale(.985);background:#22242a;border-color:#1d9bf0}
        .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
        .card-date{font-size:17px;font-weight:600;letter-spacing:-.2px}
        .card-time{font-size:14px;color:#71767b;margin-top:2px}
        .card-arrow{color:#536471;font-size:20px;padding-top:2px}
        .card-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:#71767b}
        .card-meta span{display:flex;align-items:center;gap:5px}
        .badge-ai{background:rgba(29,155,240,.12);color:#1d9bf0;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600}
        .empty-state{text-align:center;padding:80px 32px}
        .empty-icon{width:72px;height:72px;margin:0 auto 20px;background:#16181c;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #2f3336}
        .empty-icon svg{width:32px;height:32px;fill:#536471}
        .empty-state h2{font-size:20px;font-weight:700;color:#e7e9ea;margin-bottom:8px}
        .empty-state p{font-size:14px;color:#71767b;line-height:1.5}
        .footer{text-align:center;padding:32px 20px;color:#536471;font-size:12px;border-top:1px solid #2f3336;margin-top:20px}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <svg class="x-icon" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            <h1>Archive</h1>
        </div>
    </header>

    <div class="sub-header" id="subHeader" style="display:none">
        <h2>保存済みアーカイブ</h2>
        <span class="count" id="archiveCount"></span>
    </div>

    <div class="archive-list" id="archiveList"></div>

    <div class="footer">
        <p>最終更新: 2026/07/22 16:50</p>
    </div>

    <script>
    const ARCHIVES = [{"folder": "20260722_163002", "date": "2026年07月22日", "time": "16:30", "tweet_count": 603, "image_count": 863, "has_summary": true}, {"folder": "20260722_143001", "date": "2026年07月22日", "time": "14:30", "tweet_count": 598, "image_count": 823, "has_summary": true}, {"folder": "20260722_103001", "date": "2026年07月22日", "time": "10:30", "tweet_count": 634, "image_count": 852, "has_summary": true}, {"folder": "20260722_074629", "date": "2026年07月22日", "time": "07:46", "tweet_count": 656, "image_count": 857, "has_summary": true}];

    const list = document.getElementById('archiveList');
    const subHeader = document.getElementById('subHeader');
    const archiveCount = document.getElementById('archiveCount');

    if (ARCHIVES.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 14H8c-.55 0-1-.45-1-1s.45-1 1-1h8c.55 0 1 .45 1 1s-.45 1-1 1zm0-4H8c-.55 0-1-.45-1-1s.45-1 1-1h8c.55 0 1 .45 1 1s-.45 1-1 1zm0-4H8c-.55 0-1-.45-1-1s.45-1 1-1h8c.55 0 1 .45 1 1s-.45 1-1 1z"/></svg></div><h2>アーカイブがありません</h2><p>PCでキャプチャを実行してデプロイしてください</p></div>';
    } else {
        subHeader.style.display = 'flex';
        archiveCount.textContent = ARCHIVES.length + ' 件';
        list.innerHTML = ARCHIVES.map(a => `
            <a class="archive-card" href="${a.folder}/">
                <div class="card-top">
                    <div><div class="card-date">${a.date}</div><div class="card-time">${a.time}</div></div>
                    <div class="card-arrow">›</div>
                </div>
                <div class="card-meta">
                    <span>💬 ${a.tweet_count} ツイート</span>
                    <span>🖼️ ${a.image_count} 枚</span>
                    ${a.has_summary ? '<span class="badge-ai">✨ AI要約</span>' : ''}
                </div>
            </a>`).join('');
    }
    </script>
</body>
</html>
